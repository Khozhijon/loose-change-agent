# Publishes the site (and the Pocketbook demo caller at /pocketbook/) to GitHub Pages on every push to main.
# One-time setup in the repository: Settings > Pages > Source: "GitHub Actions".
# Two jobs: "build" makes and uploads the artifact, "deploy" publishes it. Splitting them follows the
# official pattern and fixes the failure "No artifacts named github-pages were found" (run 45546164932).
name: Publish site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: npm run network
      - run: npm test
      - run: npm run pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: _pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
